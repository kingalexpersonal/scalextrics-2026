<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scalextrics Comp. 2026 — checkpoint.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ivory:     #F5F0E8;
      --cream:     #EDE8DC;
      --offwhite:  #FDFCFA;
      --warm-mid:  #D6CFC0;
      --warm-dark: #8C8070;
      --ink:       #2C2820;
      --ink-soft:  #5A5248;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--ivory);
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      background: var(--ivory);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }

    /* Grain overlay */
    .scene::before {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%; height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.055;
      pointer-events: none;
      z-index: 10;
    }

    /* Vignette */
    .scene::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(180,168,148,0.2) 100%);
      pointer-events: none;
      z-index: 11;
    }

    /* Ruled lines */
    .ruled-top, .ruled-bottom {
      position: absolute;
      left: 6vw; right: 6vw;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--warm-dark) 20%, var(--warm-dark) 80%, transparent);
      opacity: 0.35;
      z-index: 20;
    }
    .ruled-top    { top: 9vh; }
    .ruled-bottom { bottom: 9vh; }

    /* Corner marks */
    .corner {
      position: absolute;
      width: 18px; height: 18px;
      opacity: 0.3;
      z-index: 20;
    }
    .corner.tl { top: calc(9vh - 9px); left:  6vw; border-top:    1px solid var(--ink); border-left:  1px solid var(--ink); }
    .corner.tr { top: calc(9vh - 9px); right: 6vw; border-top:    1px solid var(--ink); border-right: 1px solid var(--ink); }
    .corner.bl { bottom: calc(9vh - 9px); left:  6vw; border-bottom: 1px solid var(--ink); border-left:  1px solid var(--ink); }
    .corner.br { bottom: calc(9vh - 9px); right: 6vw; border-bottom: 1px solid var(--ink); border-right: 1px solid var(--ink); }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 5.5vh;
      z-index: 20;
    }

    .event-year {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(0.6rem, 1.1vw, 0.78rem);
      letter-spacing: 0.38em;
      color: var(--warm-dark);
      text-transform: uppercase;
      margin-bottom: 0.9rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.2s;
    }

    .event-title {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 6.5vw, 5.2rem);
      line-height: 0.92;
      color: var(--ink);
      letter-spacing: -0.01em;
      opacity: 0;
      animation: fadeUp 1.1s ease forwards 0.45s;
    }

    .title-italic {
      font-style: italic;
      color: var(--ink-soft);
    }

    .divider-line {
      width: 40px; height: 1px;
      background: var(--warm-dark);
      margin: 1.4rem auto;
      opacity: 0;
      animation: scaleIn 0.8s ease forwards 0.85s;
    }

    .team-badge {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(0.65rem, 1.2vw, 0.82rem);
      letter-spacing: 0.32em;
      color: var(--warm-dark);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 1.05s;
      position: relative;
      padding: 0 1.4em;
    }
    .team-badge::before,
    .team-badge::after {
      content: '—';
      position: absolute;
      top: 50%; transform: translateY(-50%);
      opacity: 0.45;
      font-size: 0.8em;
    }
    .team-badge::before { right: 100%; margin-right: -0.5em; }
    .team-badge::after  { left:  100%; margin-left:  -0.5em; }

    /* ── Countdown ── */
    .countdown {
      display: flex;
      align-items: flex-start;
      gap: 0;
      z-index: 20;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 clamp(1.2rem, 3.2vw, 3.6rem);
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }
    .unit:nth-child(1) { animation-delay: 1.1s; }
    .unit:nth-child(3) { animation-delay: 1.25s; }
    .unit:nth-child(5) { animation-delay: 1.4s; }
    .unit:nth-child(7) { animation-delay: 1.55s; }

    .vdivider {
      width: 1px;
      height: clamp(55px, 8vw, 95px);
      background: linear-gradient(180deg, transparent, var(--warm-mid) 40%, var(--warm-mid) 60%, transparent);
      align-self: center;
      margin-top: -1.2rem;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 1.8s;
    }

    .unit-number {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(4rem, 10.5vw, 9rem);
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }

    .unit.seconds .unit-number {
      animation: breathe 3s ease-in-out infinite;
      color: var(--ink-soft);
    }

    .unit-rule {
      width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--warm-dark) 30%, var(--warm-dark) 70%, transparent);
      opacity: 0.25;
      margin: 0.5rem 0 0.55rem;
    }

    .unit-label {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(0.55rem, 0.9vw, 0.7rem);
      letter-spacing: 0.3em;
      color: var(--warm-dark);
      text-transform: uppercase;
    }

    /* ── Footer ── */
    .footer {
      position: absolute;
      bottom: 5vh;
      left: 0; right: 0;
      text-align: center;
      z-index: 20;
    }

    .footer p {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(0.55rem, 0.85vw, 0.68rem);
      letter-spacing: 0.25em;
      color: var(--warm-dark);
      opacity: 0;
      animation: fadeIn 1s ease forwards 2.1s;
    }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .event-title { font-size: clamp(2rem, 10vw, 3rem); }
      .unit-number  { font-size: clamp(3rem, 18vw, 5rem); }
      .unit { padding: 0 clamp(0.8rem, 4vw, 1.6rem); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ruled-top"></div>
    <div class="ruled-bottom"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="header">
      <p class="event-year">15 &middot; June &middot; 2026</p>
      <h1 class="event-title">Scalextrics<br><span class="title-italic">Comp.</span> 2026</h1>
      <div class="divider-line"></div>
      <span class="team-badge">checkpoint.</span>
    </div>

    <div class="countdown">
      <div class="unit" id="unit-days">
        <span class="unit-number" id="days">00</span>
        <div class="unit-rule"></div>
        <span class="unit-label">Days</span>
      </div>
      <div class="vdivider"></div>
      <div class="unit" id="unit-hours">
        <span class="unit-number" id="hours">00</span>
        <div class="unit-rule"></div>
        <span class="unit-label">Hours</span>
      </div>
      <div class="vdivider"></div>
      <div class="unit" id="unit-minutes">
        <span class="unit-number" id="minutes">00</span>
        <div class="unit-rule"></div>
        <span class="unit-label">Minutes</span>
      </div>
      <div class="vdivider"></div>
      <div class="unit seconds" id="unit-seconds">
        <span class="unit-number" id="seconds">00</span>
        <div class="unit-rule"></div>
        <span class="unit-label">Seconds</span>
      </div>
    </div>

    <div class="footer">
      <p>The clock is running &nbsp;&middot;&nbsp; checkpoint. racing club</p>
    </div>
  </div>

  <script>
    const TARGET = new Date("2026-06-15T00:00:00");

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now  = new Date();
      const diff = TARGET - now;

      if (diff <= 0) {
        document.getElementById("days").textContent    = "00";
        document.getElementById("hours").textContent   = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours   = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent    = pad(days);
      document.getElementById("hours").textContent   = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
